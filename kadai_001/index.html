<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>My Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta description="Kazuki AsahinaのWork Gallary">
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <!--header-->
    <header>
      <h1 class="page-title">My Profile</h1>

      <!--nav-->
      <nav class=" nav-container">
        <ul class="nav-col">
          <li class="nav-wrap"><a class="nav-item" href="index.html#about">About</a></li>
          <li class="nav-wrap"><a class="nav-item" href="index.html#works">Works</a></li>
        </ul>
      </nav>
    </header>

    <!--main-->
    <main>
      <article>
        <!--main-photo-->
        <div class="main-image">
          <img src="images/main.png" alt="カメラの写真">
        </div>

        <!--about-->
        <section class="about">
          <h1 class="heading">About</h1>
          <div class="profile">
            <img class="about-image" src="images/about.png" alt="自分の写真">
            <ul class="info">
              <h2 class="name">Kazuki Asahina</h2>
              <li>25歳、長野県佐久市出身</li>
              <li>ソフトウェア業界でマーケティングに従事</li>
              <li>趣味はカメラ、愛機はCanon</li>
              <li>自然を撮影するのが好きで、海や山によく行く</li>
            </ul>
          </div>
        </section>

        <!--works-->
        <section class="works">
          <h1 class="heading">Works</h1>
          <div class="works-item">
            <div class="works-col">
              <img src="images/works1.png" alt="海の写真">
              <p>新潟に訪れた際に、日本海の雄大さを魅了されて撮影した1枚</p>
            </div>
            <div class="works-col">
              <img src="images/works2.png" alt="山の写真">
              <p>地元長野の木曽町から撮影した、冠雪した御嶽山</p>
            </div>
            <div class="works-col">
              <img src="images/works3.png" alt="町の写真">
              <p>京都で撮影した、明け方の古き良き日本の町並み</p>
            </div>
          </div>
        </section>
      </article>
    </main>

    <!--footer-->
    <footer>
      <p class="copyright">&copy; MyProfile. All rights reserved.</p>
    </footer>
  </body>
</html>
